name: CMS Persistence Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [repair/cp-splash-product-engine-persistence-20261119]

permissions:
  contents: read

jobs:
  cms-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cms-persistence
